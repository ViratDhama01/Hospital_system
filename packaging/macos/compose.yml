services:
  db:
    image: ${MEDORA_DATABASE_IMAGE:?}
    environment:
      POSTGRES_DB: medora
      POSTGRES_USER: medora
      POSTGRES_PASSWORD: ${MEDORA_DATABASE_PASSWORD:?}
    volumes:
      - storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medora -d medora"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${MEDORA_APP_IMAGE:?}
    environment:
      DATABASE_URL: postgresql://medora:${MEDORA_DATABASE_PASSWORD:?}@db:5432/medora
      HOSPITAL_SECRET_KEY: ${MEDORA_SECRET_KEY:?}
    ports:
      - "127.0.0.1:38180:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/ping', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  storage:
